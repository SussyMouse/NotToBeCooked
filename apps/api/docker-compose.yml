version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: not_to_be_cooked_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: not_to_be_cooked
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/not_to_be_cooked
      - ALLOWED_ORIGINS=https://yourdomain.com
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgvector_data:
