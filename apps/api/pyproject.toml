[project]
name = "api"
version = "0.0.1"
description = "FastAPI backend for NotToBeCooked monorepo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.3.0",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "pgvector>=0.3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "docling>=2.117.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "sentence-transformers>=5.7.0",
    "kernels>=0.16.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
