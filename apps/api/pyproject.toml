[project]
name = "api"
version = "0.0.1"
description = "FastAPI backend for NotToBeCooked monorepo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.3.0",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "pgvector>=0.3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
