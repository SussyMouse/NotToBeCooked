<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NotToBeCooked — Complete ERD</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #080c14;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 7680px; height: 4320px; overflow: hidden; background: #080c14; }
    svg { display: block; width: 7680px; height: 4320px; }
    .title { font-size: 64px; font-weight: 800; fill: #f8fafc; letter-spacing: -1px; }
    .subtitle { font-size: 28px; fill: #94a3b8; }
    .group-label { font-size: 23px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .box { fill: #111827; stroke-width: 2.5; filter: url(#shadow); }
    .box-header { stroke: none; }
    .table-name { font-size: 27px; font-weight: 800; fill: #f8fafc; letter-spacing: .6px; }
    .table-desc { font-size: 19px; fill: #cbd5e1; }
    .row-rule { stroke: #263244; stroke-width: 1; }
    .field-name { font: 600 21px Consolas, "Courier New", monospace; fill: #e5e7eb; }
    .field-type { font: 19px Consolas, "Courier New", monospace; fill: #94a3b8; }
    .field-note { font-size: 17px; fill: #64748b; }
    .badge-text { font: 800 15px Consolas, "Courier New", monospace; fill: #07111d; }
    .relation { fill: none; stroke: #66758a; stroke-width: 3; }
    .relation-label { font-size: 18px; font-weight: 700; fill: #94a3b8; paint-order: stroke; stroke: #080c14; stroke-width: 8px; stroke-linejoin: round; }
    .cardinality { font: 800 18px Consolas, "Courier New", monospace; fill: #dbeafe; paint-order: stroke; stroke: #080c14; stroke-width: 8px; }
    .legend-title { font-size: 21px; font-weight: 800; fill: #f8fafc; }
    .legend-text { font-size: 19px; fill: #94a3b8; }
    .footer { font-size: 19px; fill: #64748b; }
  </style>
</head>
<body>
<svg id="diagram" viewBox="0 0 7680 4320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Complete acyclic ERD for NotToBeCooked">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity=".38" />
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#172033" stroke-width="1" opacity=".35" />
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12" />
      <stop offset=".55" stop-color="#0b1120" />
      <stop offset="1" stop-color="#090d16" />
    </linearGradient>
    <marker id="many" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 2 L 14 9 L 1 16 M 14 9 L 1 9" fill="none" stroke="#93c5fd" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="7680" height="4320" fill="url(#bg)" />
  <rect width="7680" height="4320" fill="url(#grid)" />

  <text x="90" y="105" class="title">NotToBeCooked — Complete Database ERD</text>
  <text x="92" y="158" class="subtitle">PostgreSQL 16 + pgvector · strict acyclic foreign-key ownership · implementation-ready field names</text>
  <g id="relations"></g>
  <g id="tables"></g>
  <g id="legend"></g>
</svg>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const boxWidth = 820;
  const headerHeight = 78;
  const rowHeight = 36;
  const palette = {
    identity: { stroke: "#2dd4bf", header: "#0f766e", badge: "#5eead4" },
    academic: { stroke: "#60a5fa", header: "#1d4ed8", badge: "#93c5fd" },
    document: { stroke: "#a78bfa", header: "#6d28d9", badge: "#c4b5fd" },
    rag:      { stroke: "#4ade80", header: "#15803d", badge: "#86efac" },
    chat:     { stroke: "#fbbf24", header: "#a16207", badge: "#fde68a" },
    study:    { stroke: "#f472b6", header: "#be185d", badge: "#f9a8d4" }
  };

  const tables = [
    { id:"users", name:"USERS", desc:"Account root", group:"identity", x:80, y:420, fields:[
      ["PK","id","uuid","NOT NULL"], ["UQ","email","varchar(320)","NOT NULL"],
      ["","hashed_password","text","NOT NULL"], ["","display_name","varchar(120)","NULL"],
      ["","created_at","timestamptz","NOT NULL"], ["","updated_at","timestamptz","NOT NULL"],
      ["","deleted_at","timestamptz","NULL"] ] },
    { id:"auth_sessions", name:"AUTH_SESSIONS", desc:"Refresh-token revocation", group:"identity", x:80, y:1200, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","user_id","uuid","→ users.id"],
      ["UQ","refresh_token_hash","text","NOT NULL"], ["","device_name","varchar(160)","NULL"],
      ["","expires_at","timestamptz","NOT NULL"], ["","revoked_at","timestamptz","NULL"],
      ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"academic_terms", name:"ACADEMIC_TERMS", desc:"Year / semester scope", group:"academic", x:1020, y:420, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","user_id","uuid","→ users.id"],
      ["","calendar_year","smallint","NOT NULL"], ["","study_year","smallint","NOT NULL"],
      ["","semester_no","smallint","NOT NULL"], ["","label","varchar(80)","NULL"],
      ["","starts_on","date","NULL"], ["","ends_on","date","NULL"],
      ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"courses", name:"COURSES", desc:"Study workspace", group:"academic", x:1960, y:420, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","term_id","uuid","→ academic_terms.id"],
      ["","code","varchar(32)","NOT NULL"], ["","name","varchar(200)","NOT NULL"],
      ["","teaching_weeks","smallint","DEFAULT 14"], ["","goal_text","text","NULL"],
      ["","created_at","timestamptz","NOT NULL"], ["","updated_at","timestamptz","NOT NULL"],
      ["","archived_at","timestamptz","NULL"] ] },
    { id:"folders", name:"FOLDERS", desc:"One-level course categories", group:"document", x:2900, y:200, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","course_id","uuid","→ courses.id"],
      ["","name","varchar(120)","NOT NULL"], ["","is_root","boolean","DEFAULT false"],
      ["","sort_order","integer","DEFAULT 0"], ["","created_at","timestamptz","NOT NULL"],
      ["","updated_at","timestamptz","NOT NULL"] ] },
    { id:"documents", name:"DOCUMENTS", desc:"Logical file identity", group:"document", x:3840, y:200, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","folder_id","uuid","→ folders.id"],
      ["","display_name","varchar(255)","NOT NULL"], ["","created_at","timestamptz","NOT NULL"],
      ["","updated_at","timestamptz","NOT NULL"], ["","deleted_at","timestamptz","NULL"] ] },
    { id:"document_labels", name:"DOCUMENT_LABELS", desc:"Searchable per-file labels", group:"document", x:3840, y:1050, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","document_id","uuid","→ documents.id"],
      ["","value","varchar(80)","NOT NULL"], ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"document_versions", name:"DOCUMENT_VERSIONS", desc:"Immutable uploaded binary", group:"document", x:4780, y:160, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","document_id","uuid","→ documents.id"],
      ["","version_no","integer","NOT NULL"], ["","original_filename","varchar(255)","NOT NULL"],
      ["UQ","storage_key","text","NOT NULL"], ["UQ","sha256","char(64)","NOT NULL"],
      ["","mime_type","varchar(120)","NOT NULL"], ["","size_bytes","bigint","NOT NULL"],
      ["","page_count","integer","NULL"], ["","status","varchar(20)","NOT NULL"],
      ["","error_message","text","NULL"], ["","is_current","boolean","DEFAULT true"],
      ["","uploaded_at","timestamptz","NOT NULL"], ["","indexed_at","timestamptz","NULL"] ] },
    { id:"ingestion_runs", name:"INGESTION_RUNS", desc:"Re-runnable processing attempt", group:"rag", x:5720, y:200, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","document_version_id","uuid","→ document_versions.id"],
      ["","status","varchar(20)","NOT NULL"], ["","chunker_version","varchar(80)","NOT NULL"],
      ["","embedding_model","varchar(160)","NOT NULL"], ["","embedding_dim","smallint","DEFAULT 1024"],
      ["","is_active","boolean","DEFAULT false"], ["","started_at","timestamptz","NOT NULL"],
      ["","completed_at","timestamptz","NULL"], ["","error_message","text","NULL"] ] },
    { id:"chunks", name:"CHUNKS", desc:"Regenerable retrieval units", group:"rag", x:6660, y:160, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","ingestion_run_id","uuid","→ ingestion_runs.id"],
      ["","chunk_index","integer","NOT NULL"], ["","page_start","integer","NULL"],
      ["","page_end","integer","NULL"], ["","heading","text","NULL"],
      ["","content","text","NOT NULL"], ["","word_count","integer","NOT NULL"],
      ["","token_count","integer","NOT NULL"], ["IDX","embedding","vector(1024)","NOT NULL"],
      ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"conversations", name:"CONVERSATIONS", desc:"Course-scoped chat", group:"chat", x:2900, y:1450, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","course_id","uuid","→ courses.id"],
      ["","title","varchar(200)","NULL"], ["","created_at","timestamptz","NOT NULL"],
      ["","updated_at","timestamptz","NOT NULL"], ["","archived_at","timestamptz","NULL"] ] },
    { id:"messages", name:"MESSAGES", desc:"Ordered user / assistant turns", group:"chat", x:3840, y:1450, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","conversation_id","uuid","→ conversations.id"],
      ["","sequence_no","integer","NOT NULL"], ["","role","varchar(16)","NOT NULL"],
      ["","content","text","NOT NULL"], ["","grounded","boolean","NULL"],
      ["","used_chunks","smallint","NULL"], ["","model_name","varchar(120)","NULL"],
      ["","scope_snapshot","jsonb","NULL"], ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"message_citations", name:"MESSAGE_CITATIONS", desc:"Immutable evidence snapshot", group:"chat", x:4780, y:1400, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","message_id","uuid","→ messages.id"],
      ["","marker","smallint","NOT NULL"], ["SNAP","source_document_id","uuid","NO FOREIGN KEY"],
      ["SNAP","source_version_no","integer","NOT NULL"], ["SNAP","filename_snapshot","varchar(255)","NOT NULL"],
      ["","page_start","integer","NULL"], ["","page_end","integer","NULL"],
      ["","quote","text","NOT NULL"], ["","created_at","timestamptz","NOT NULL"] ] },
    { id:"roadmap_items", name:"ROADMAP_ITEMS", desc:"Weekly topics and milestones", group:"study", x:2900, y:2420, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","course_id","uuid","→ courses.id"],
      ["","position","integer","NOT NULL"], ["","week_no","smallint","NULL"],
      ["","title","varchar(255)","NOT NULL"], ["","item_type","varchar(24)","NOT NULL"],
      ["","status","varchar(20)","NOT NULL"], ["","due_at","timestamptz","NULL"],
      ["SNAP","source_snapshot","jsonb","NULL"], ["","created_at","timestamptz","NOT NULL"],
      ["","updated_at","timestamptz","NOT NULL"] ] },
    { id:"flashcard_decks", name:"FLASHCARD_DECKS", desc:"Course study deck", group:"study", x:3840, y:2400, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","course_id","uuid","→ courses.id"],
      ["","title","varchar(200)","NOT NULL"], ["","description","text","NULL"],
      ["","created_at","timestamptz","NOT NULL"], ["","updated_at","timestamptz","NOT NULL"],
      ["","archived_at","timestamptz","NULL"] ] },
    { id:"flashcards", name:"FLASHCARDS", desc:"Grounded question / answer", group:"study", x:4780, y:2400, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","deck_id","uuid","→ flashcard_decks.id"],
      ["","position","integer","NOT NULL"], ["","question","text","NOT NULL"],
      ["","answer","text","NOT NULL"], ["SNAP","source_snapshot","jsonb","NULL"],
      ["","created_at","timestamptz","NOT NULL"], ["","updated_at","timestamptz","NOT NULL"] ] },
    { id:"flashcard_reviews", name:"FLASHCARD_REVIEWS", desc:"Spaced-repetition history", group:"study", x:5720, y:2400, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","flashcard_id","uuid","→ flashcards.id"],
      ["","rating","smallint","NOT NULL"], ["","reviewed_at","timestamptz","NOT NULL"],
      ["","next_review_at","timestamptz","NULL"], ["","interval_days","integer","NOT NULL"],
      ["","ease_factor","numeric(4,2)","NOT NULL"] ] },
    { id:"study_artifacts", name:"STUDY_ARTIFACTS", desc:"Saved matrix / summary output", group:"study", x:2900, y:3350, fields:[
      ["PK","id","uuid","NOT NULL"], ["FK","course_id","uuid","→ courses.id"],
      ["","artifact_type","varchar(32)","NOT NULL"], ["","title","varchar(200)","NOT NULL"],
      ["","payload","jsonb","NOT NULL"], ["SNAP","source_snapshot","jsonb","NULL"],
      ["","created_at","timestamptz","NOT NULL"], ["","updated_at","timestamptz","NOT NULL"] ] }
  ];

  const relations = [
    ["users","auth_sessions","authenticates"], ["users","academic_terms","owns"],
    ["academic_terms","courses","contains"], ["courses","folders","organizes"],
    ["folders","documents","contains"], ["documents","document_labels","labels"],
    ["documents","document_versions","versions"], ["document_versions","ingestion_runs","processes"],
    ["ingestion_runs","chunks","produces"], ["courses","conversations","has chats"],
    ["conversations","messages","contains"], ["messages","message_citations","supports"],
    ["courses","roadmap_items","plans"], ["courses","flashcard_decks","has decks"],
    ["flashcard_decks","flashcards","contains"], ["flashcards","flashcard_reviews","records"],
    ["courses","study_artifacts","generates"]
  ];

  const byId = Object.fromEntries(tables.map(t => {
    t.w = boxWidth;
    t.h = headerHeight + t.fields.length * rowHeight + 18;
    return [t.id, t];
  }));

  function el(name, attrs={}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, String(v)));
    return node;
  }
  function textNode(x, y, cls, value, anchor) {
    const node = el("text", {x, y, class:cls});
    if (anchor) node.setAttribute("text-anchor", anchor);
    node.textContent = value;
    return node;
  }
  function badgeWidth(value) { return value ? Math.max(46, value.length * 11 + 18) : 46; }

  function anchorPair(a,b) {
    const acx=a.x+a.w/2, acy=a.y+a.h/2, bcx=b.x+b.w/2, bcy=b.y+b.h/2;
    if (Math.abs(bcx-acx) > Math.abs(bcy-acy)) {
      return bcx >= acx
        ? [{x:a.x+a.w,y:acy},{x:b.x,y:bcy},"h"]
        : [{x:a.x,y:acy},{x:b.x+b.w,y:bcy},"h"];
    }
    return bcy >= acy
      ? [{x:acx,y:a.y+a.h},{x:bcx,y:b.y},"v"]
      : [{x:acx,y:a.y},{x:bcx,y:b.y+b.h},"v"];
  }

  const relLayer = document.getElementById("relations");
  relations.forEach(([parentId,childId,label]) => {
    const parent=byId[parentId], child=byId[childId];
    const [p1,p2,axis] = anchorPair(parent,child);
    let d, lx, ly;
    if (axis === "h") {
      const mid=(p1.x+p2.x)/2;
      d=`M ${p1.x} ${p1.y} C ${mid} ${p1.y}, ${mid} ${p2.y}, ${p2.x} ${p2.y}`;
      lx=mid; ly=(p1.y+p2.y)/2-14;
    } else {
      const mid=(p1.y+p2.y)/2;
      d=`M ${p1.x} ${p1.y} C ${p1.x} ${mid}, ${p2.x} ${mid}, ${p2.x} ${p2.y}`;
      lx=(p1.x+p2.x)/2+18; ly=mid-10;
    }
    const path=el("path", {d, class:"relation", "marker-end":"url(#many)"});
    relLayer.appendChild(path);
    relLayer.appendChild(textNode(p1.x + (axis==="h" ? (p2.x>p1.x?22:-22):16), p1.y-12, "cardinality", "1", axis==="h" && p2.x<p1.x ? "end" : "start"));
    relLayer.appendChild(textNode(p2.x + (axis==="h" ? (p2.x>p1.x?-22:22):16), p2.y-12, "cardinality", "0..N", axis==="h" && p2.x>p1.x ? "end" : "start"));
    relLayer.appendChild(textNode(lx,ly,"relation-label",label,"middle"));
  });

  const tableLayer = document.getElementById("tables");
  tables.forEach(t => {
    const color=palette[t.group], g=el("g", {"data-table":t.id});
    g.appendChild(el("rect", {x:t.x,y:t.y,width:t.w,height:t.h,rx:18,class:"box",stroke:color.stroke}));
    g.appendChild(el("path", {d:`M ${t.x+18} ${t.y} H ${t.x+t.w-18} Q ${t.x+t.w} ${t.y} ${t.x+t.w} ${t.y+18} V ${t.y+headerHeight} H ${t.x} V ${t.y+18} Q ${t.x} ${t.y} ${t.x+18} ${t.y} Z`,class:"box-header",fill:color.header}));
    g.appendChild(textNode(t.x+22,t.y+34,"table-name",t.name));
    g.appendChild(textNode(t.x+22,t.y+62,"table-desc",t.desc));
    t.fields.forEach((f,i) => {
      const [badge,name,type,note]=f, top=t.y+headerHeight+i*rowHeight;
      if(i>0) g.appendChild(el("line",{x1:t.x+16,y1:top,x2:t.x+t.w-16,y2:top,class:"row-rule"}));
      const bw=badgeWidth(badge);
      if(badge){
        const badgeColor=badge==="FK"?"#fbbf24":badge==="SNAP"?"#fb7185":badge==="IDX"?"#67e8f9":color.badge;
        g.appendChild(el("rect",{x:t.x+16,y:top+7,width:bw,height:23,rx:7,fill:badgeColor}));
        g.appendChild(textNode(t.x+16+bw/2,top+24,"badge-text",badge,"middle"));
      }
      g.appendChild(textNode(t.x+78,top+25,"field-name",name));
      g.appendChild(textNode(t.x+370,top+25,"field-type",type));
      g.appendChild(textNode(t.x+606,top+25,"field-note",note));
    });
    tableLayer.appendChild(g);
  });

  const legend=document.getElementById("legend");
  legend.appendChild(el("rect",{x:80,y:3850,width:2420,height:330,rx:22,fill:"#0f172a",stroke:"#334155","stroke-width":2}));
  legend.appendChild(textNode(115,3900,"legend-title","KEY & CONSTRAINT LEGEND"));
  const legendItems=[
    ["PK","Primary key"],["FK","Physical foreign key"],["UQ","Unique"],["IDX","Indexed"],["SNAP","Immutable snapshot — deliberately not an FK"]
  ];
  legendItems.forEach((item,i)=>{
    const x=115+(i%3)*760, y=3950+Math.floor(i/3)*78;
    const colors={PK:"#5eead4",FK:"#fbbf24",UQ:"#93c5fd",IDX:"#67e8f9",SNAP:"#fb7185"};
    const bw=badgeWidth(item[0]);
    legend.appendChild(el("rect",{x,y:y-24,width:bw,height:28,rx:7,fill:colors[item[0]]}));
    legend.appendChild(textNode(x+bw/2,y-4,"badge-text",item[0],"middle"));
    legend.appendChild(textNode(x+bw+16,y-3,"legend-text",item[1]));
  });
  legend.appendChild(textNode(2600,3920,"legend-title","ACYCLIC DESIGN GUARANTEE"));
  legend.appendChild(textNode(2600,3965,"legend-text","Every physical FK points from a child to exactly one ancestor. No parent stores a child FK."));
  legend.appendChild(textNode(2600,4004,"legend-text","No folder.parent_folder_id · no document.current_version_id · no version.active_run_id · no message.reply_to_id."));
  legend.appendChild(textNode(2600,4043,"legend-text","Citation and generated-source references are immutable snapshots, so Chat and Study branches never reconnect to Documents."));
  legend.appendChild(textNode(90,4265,"footer","Notation: 1 = exactly one parent · 0..N = zero or many children · all timestamps are UTC timestamptz · UUIDs generated server-side"));
</script>
</body>
</html>
